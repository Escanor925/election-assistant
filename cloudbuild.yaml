steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/voter-education-assistant', '.']
  
  # Step 2: Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/voter-education-assistant']
    
  # Step 3: Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'voter-education-assistant'
      - '--image'
      - 'gcr.io/$PROJECT_ID/voter-education-assistant'
      - '--region'
      - 'us-central1' # Replace with your preferred region if needed
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      # Safely inject environment variables (ensure _GEMINI_API_KEY is configured in Cloud Build triggers)
      - '--set-env-vars'
      - 'GEMINI_API_KEY=$_GEMINI_API_KEY'

images:
  - 'gcr.io/$PROJECT_ID/voter-education-assistant'
